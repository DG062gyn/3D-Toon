<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG062 — Haute Couture & Luxury Streetwear</title>
    <!-- Fontes Conectadas: Cinzel para a Realeza, Plus Jakarta para os Detalhes Técnicos -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card-container">
        <!-- Nome Monumental ao Fundo — Ouro & Platina Imperial -->
        <h1 id="bg-title" class="bg-title">STREETWEARDG062</h1>

        <!-- Espaço Central Vazio Propositalmente: O Minimalismo é a Máxima Expressão do Luxo -->
        <div class="main-character-wrapper"></div>

        <!-- Bloco de Informações Inferior Esquerdo -->
        <div id="bottom-left" class="bottom-left">
            <p id="product-title" class="product-title">PREMIUM APPAREL & COLLECTIBLES</p>

            </p>

            <!-- Botões Estilo Joia Minimalista -->
            <div id="nav-buttons" class="nav-buttons">
                <button class="nav-btn" id="btn-prev" aria-label="Previous">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <button class="nav-btn" id="btn-next" aria-label="Next">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Canto Inferior Direito: Link de Entrada para Membros -->
        <div class="bottom-right">
            <a href="#" class="cta-link">ENTRAR NA PRIVATE ROOM &rarr;</a>
        </div>
    </main>

    <!-- Script Conectado e sob Monitoramento -->
    <script src="script.js"></script>
