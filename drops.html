    <!-- Script interno temporário do relógio para garantir que funcione de primeira -->
    <script>
        // Configura o relógio para contar até 7 dias a partir de hoje automaticamente
        const dataAlvo = new Date();
        dataAlvo.setDate(dataAlvo.getDate() + 7);

        function atualizarCronometro() {
            const agora = new Date().getTime();
            const diferenca = dataAlvo - agora;

            // Cálculos matemáticos de tempo
            const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferenca % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferenca % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diferenca % (1000 * 60)) / 1000);

            // Injeta os números na tela com o zero na frente se for menor que 10
            document.getElementById("days").innerText = dias < 10 ? "0" + dias : dias;
            document.getElementById("hours").innerText = horas < 10 ? "0" + horas : horas;
            document.getElementById("minutes").innerText = minutos < 10 ? "0" + minutos : minutos;
            document.getElementById("seconds").innerText = segundos < 10 ? "0" + segundos : segundos;

            // Se o tempo acabar
            if (diferenca < 0) {
                clearInterval(intervalo);
                document.querySelector(".countdown-wrapper").innerHTML = "<h2 style='color:#e5c07b; font-family:Cinzel; letter-spacing:2px;'>DROP LIBERADO</h2>";
            }
        }

        // Executa a função a cada 1 segundo continuamente
        const intervalo = setInterval(atualizarCronometro, 1000);
        atualizarCronometro(); // Executa imediatamente ao carregar
    </script>
